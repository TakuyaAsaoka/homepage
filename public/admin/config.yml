# CMS管理画面のログイン設定（OAuth導入手順・PAT方式）は docs/cms-oauth-setup.md を参照
backend:
  name: github
  repo: "TakuyaAsaoka/homepage"
  branch: main
  # OAuthログイン用のsveltia-cms-auth WorkerのURL（docs/cms-oauth-setup.md のStep 4）
  base_url: "https://sveltia-cms-auth.dimas080201.workers.dev"

# 画像欄を持つのは works と Home の写真で、どちらも下で保存先を上書きしている
# （works はコレクションに、Home の写真は欄に直接書いている）。
# ここは使われないが、他に画像欄を足すときも同じく media_folder / public_folder を指定すること
# （public/ 配下に保存するとAstroが画像を読めず、寸法が出せない）
media_folder: "public/images"
public_folder: "/homepage/images"

collections:
  - name: "pages"
    label: "ページ"
    files:
      - name: "home"
        label: "Home"
        file: "src/content/pages/home.yaml"
        fields:
          - label: "ヒーロー"
            name: "hero"
            widget: "object"
            fields:
              - { label: "肩書き", name: "role", widget: "string", hint: "見出しの上に英字で表示されます（例: SOFTWARE ENGINEER / SRE）。自己紹介の名前の下にも出ます" }
              - { label: "見出し", name: "heading", widget: "text", hint: "一番大きく表示される文。改行した位置で行が分かれます。3行までにしてください（増やすと、背の低い画面で上の行が切れます）" }
              - { label: "説明", name: "lead", widget: "text", hint: "見出しの下に表示される一文" }
          - label: "自己紹介"
            name: "profile"
            widget: "object"
            fields:
              # 写真は home.yaml と同じ場所（src/content/pages/images/）に置き、YAMLからの相対パスで保存する。
              # 理由は下の works の media_folder のコメントと同じ
              - { label: "写真", name: "photo", widget: "image", required: false, media_folder: "images", public_folder: "./images", hint: "自己紹介の左に表示されます。未設定の間は写真の枠ごと出ません" }
              - { label: "活動場所", name: "place", widget: "string", hint: "例: 愛知県" }
              - { label: "リンクテキスト", name: "linkLabel", widget: "string", hint: "Aboutページへのリンクの文言" }
          - label: "できること"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "追加・削除・並び替えができます（1件以上）。経歴の文章は About の CAREER のセクションから出ます"
            fields:
              - { label: "見出し", name: "title", widget: "string", hint: "例: 業務アプリをつくる" }
              - { label: "説明", name: "body", widget: "text", hint: "1〜2文で" }
              - { label: "道具", name: "tools", widget: "list", default: [], hint: "説明の下に小さく並びます。Enterで追加できます" }
          - label: "連絡先"
            name: "contact"
            widget: "object"
            fields:
              - { label: "誘いの一文", name: "invite", widget: "text", hint: "メールアドレスのボタンの上に表示されます" }
      - name: "about"
        label: "About"
        file: "src/content/pages/about.yaml"
        fields:
          - { label: "リード文", name: "lead", widget: "text", hint: "ページ冒頭に表示される導入文" }
          - label: "セクション"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "セクションの追加・削除・並び替えができます"
            fields:
              - { label: "見出し", name: "title", widget: "string", hint: "例: 歩み" }
              - { label: "英字ラベル", name: "label", widget: "string", hint: "見出しの横に表示される英字（例: CAREER）。CAREER のセクションは Home の自己紹介にも出るため、消したり改名したりするとビルドが止まります" }
              - { label: "本文", name: "body", widget: "text", hint: "空行を入れると段落が分かれます" }

  - name: "works"
    label: "制作"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    # 画像は制作と同じ場所（src/content/works/images/）に置き、Markdownからの相対パスで保存する。
    # public/ に置くとAstroが中身を読めず、img に寸法を出せない（読み込み時に本文がずれる）。
    # public_folder は先頭が "." のときだけそのまま使われ、それ以外は "/" を前置される
    media_folder: "images"
    public_folder: "./images"
    fields:
      - { label: "タイトル", name: "title", widget: "string", hint: "制作の名前" }
      - { label: "説明", name: "description", widget: "text", hint: "一覧やSNS共有時に表示される短い説明文" }
      - { label: "タグ", name: "tags", widget: "list", default: [], hint: "使用技術など。Enterで追加できます" }
      - { label: "画像", name: "image", widget: "image", required: false, hint: "一覧・詳細ページに表示される画像" }
      - { label: "役割", name: "role", widget: "string", required: false, hint: "この制作で担当したこと（例: 設計・開発・運用をひとりで）。空欄ならカードに出ません" }
      - { label: "結果", name: "outcome", widget: "string", required: false, hint: "作って何が良くなったかを1文で。空欄ならカードに出ません" }
      - { label: "URL", name: "url", widget: "string", required: false, pattern: ["^(https?://\\S+)?$", "https:// または http:// で始まる正しいURLを入力してください（空欄可）"], hint: "制作の公開URL（あれば）" }
      # 公開日は暦日として保存する（時刻を持たせると保存時のTZで日付が1日ずれる）
      - { label: "公開日", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", time_format: false, hint: "一覧はこの日付の新しい順に並びます" }
      - { label: "下書き", name: "draft", widget: "boolean", default: false, hint: "オンにするとサイトに表示されません" }
      - { label: "本文", name: "body", widget: "markdown", hint: "詳細ページの本文" }

  - name: "settings"
    label: "サイト設定"
    files:
      - name: "site"
        label: "サイト設定"
        file: "src/content/settings/site.yaml"
        fields:
          - { label: "サイト名", name: "title", widget: "string", hint: "ヘッダー・ブラウザのタブ・SNS共有時に表示されます" }
          - { label: "サイト説明", name: "description", widget: "string", hint: "検索結果やSNS共有時に表示される説明文" }
          - { label: "表示名", name: "author", widget: "string", hint: "Homeの自己紹介に表示される名前" }
          - { label: "著作権表記", name: "copyrightHolder", widget: "string", hint: "フッターの©の後に表示される欧文表記" }
          - { label: "メールアドレス", name: "email", widget: "string", pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "正しいメールアドレスの形式で入力してください"], hint: "Homeの連絡先に表示されます" }
          - label: "SNSリンク"
            name: "social"
            widget: "object"
            fields:
              - { label: "GitHub", name: "github", widget: "string", required: false, default: "", pattern: ["^(https?://\\S+)?$", "https:// または http:// で始まる正しいURLを入力してください（空欄可）"], hint: "プロフィールのURL。空にすると非表示になります" }
              - { label: "X（Twitter）", name: "twitter", widget: "string", required: false, default: "", pattern: ["^(https?://\\S+)?$", "https:// または http:// で始まる正しいURLを入力してください（空欄可）"], hint: "プロフィールのURL。空にすると非表示になります" }
              - { label: "YouTube", name: "youtube", widget: "string", required: false, default: "", pattern: ["^(https?://\\S+)?$", "https:// または http:// で始まる正しいURLを入力してください（空欄可）"], hint: "チャンネルのURL。空にすると非表示になります" }
          - { label: "note RSS URL", name: "noteRssUrl", widget: "string", required: false, default: "", pattern: ["^(https?://\\S+)?$", "https:// または http:// で始まる正しいURLを入力してください（空欄可）"], hint: "noteのRSS URL（例: https://note.com/xxx/rss）。空にするとブログページのRSS連携が止まります" }
