name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit test
        run: npm run test:run
      # PRではデプロイ用の build ジョブがスキップされるため、ここでビルドが通ることを確かめる。
      # PR以外（mainへのpush・手動実行）では build ジョブの withastro/action が
      # 同じビルドを走らせるので、ここでは実行しない。
      #
      # ビルドは書体のファイル（100個以上）を Google から取り、node_modules/.astro/fonts に置く。
      # 1個でも通信に失敗するとビルドごと落ちるため、main のビルドが保存したものを読んで使い回す
      # （置いてある書体は取りに行かない）。保存しているのは build ジョブの withastro/action で、
      # キーの形（astro-cache-<OS>-<コミット>）はその action に合わせている。ここでは読むだけで保存しない。
      # npm ci は node_modules を消してから入れ直すので、必ず Install dependencies より後に置く。
      - name: Restore Astro cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro
          key: astro-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            astro-cache-${{ runner.os }}-
      - name: Build (PR only)
        if: github.event_name == 'pull_request'
        run: npm run build

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
